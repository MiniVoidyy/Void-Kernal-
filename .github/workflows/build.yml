name: Build Void Kernel

on:
  workflow_dispatch:
    inputs:
      ksu_ref:
        description: "Root solution repo ref (tag/branch, blank = HEAD)"
        required: false
        default: ""
  push:
    branches: [main, master]

env:
  KSU_REF: ${{ github.event.inputs.ksu_ref || '' }}

jobs:
  kernel:
    name: ${{ matrix.variant }} / ${{ matrix.root }} / ${{ matrix.device }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        variant: [aosp-enforcing, aosp-permissive, oneui-enforcing, oneui-permissive]
        root: [ksu, ksu-next, sukisu]
        device: [starlte, star2lte, crownlte]
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git unzip zip \
            libssl-dev libfl-dev python-is-python3 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Void Kernel (${{ matrix.variant }} x ${{ matrix.root }} x ${{ matrix.device }})
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          chmod +x scripts/*.sh
          scripts/build.sh --variant "${{ matrix.variant }}" --root "${{ matrix.root }}" --device "${{ matrix.device }}" 2>&1 | tee "$GITHUB_WORKSPACE/build-full.log"

      - name: Upload flashable zips
        uses: actions/upload-artifact@v4
        with:
          name: VoidKernel-${{ matrix.variant }}-${{ matrix.root }}-${{ matrix.device }}
          path: build/zips/*.zip
          if-no-files-found: error

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildlogs-${{ matrix.variant }}-${{ matrix.root }}-${{ matrix.device }}
          path: logs/*.log
          if-no-files-found: ignore

      - name: Commit failure logs back to repo
        if: failure()
        run: |
          git config user.name "void-ci-bot"
          git config user.email "bot@users.noreply.github.com"
          D="ci-logs/${{ matrix.variant }}-${{ matrix.root }}-${{ matrix.device }}"
          mkdir -p "$D"
          cp "$GITHUB_WORKSPACE/build-full.log" "$D/build-full.log" 2>/dev/null || true
          cp logs/*.log "$D/" 2>/dev/null || true
          git add ci-logs
          git commit -m "ci: failure logs for ${{ matrix.variant }}/${{ matrix.root }}/${{ matrix.device }} [skip ci]" || exit 0
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep $((RANDOM % 20 + 5))
          done

  manager:
    name: Void Kernel Manager module
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Pack manager module
        run: |
          mkdir -p build/zips
          (cd manager && zip -r9 ../build/zips/VoidKernel-Manager-v1.0.zip .)

      - name: Upload manager module
        uses: actions/upload-artifact@v4
        with:
          name: VoidKernel-Manager
          path: build/zips/VoidKernel-Manager-v1.0.zip
