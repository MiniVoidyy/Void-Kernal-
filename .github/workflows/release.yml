name: Release Void Kernel

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  universal:
    name: Build universal (${{ matrix.root }})
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        root: [ksu, ksu-next, sukisu]
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git unzip zip \
            libssl-dev libfl-dev python-is-python3 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Build universal zip (${{ matrix.root }})
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          chmod +x scripts/*.sh
          scripts/package-universal.sh "${{ matrix.root }}" "$GITHUB_WORKSPACE/kernel-src" 2>&1 | tee "$GITHUB_WORKSPACE/build-full.log"

      - name: Upload universal zip
        uses: actions/upload-artifact@v4
        with:
          name: VoidKernel-${{ matrix.root }}-universal
          path: build/zips/*.zip
          if-no-files-found: error

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildlogs-${{ matrix.root }}-universal
          path: |
            logs/*.log
            build-full.log
          if-no-files-found: ignore

  manager:
    name: Void Kernel Manager module
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Pack manager module
        run: |
          mkdir -p build/zips
          (cd manager && zip -r9 ../build/zips/VoidKernel-Manager-v1.1.zip .)

      - name: Upload manager module
        uses: actions/upload-artifact@v4
        with:
          name: VoidKernel-Manager
          path: build/zips/VoidKernel-Manager-v1.1.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [universal, manager]
    runs-on: ubuntu-22.04
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect zips
        run: |
          mkdir -p release
          find artifacts -name '*.zip' -exec cp {} release/ \;
          ls -la release/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Void Kernel ${{ github.ref_name }}
          body: |
            **Void Kernel** for Galaxy S9 (starlte), S9+ (star2lte) and Note 9 (crownlte) - exynos9810, Linux 4.9.337 (DS-ACK).

            ## Downloads
            Pick ONE universal zip matching your root solution:

            - `VoidKernel-ksu-universal-4.9.337.zip` - KernelSU v0.9.5
            - `VoidKernel-ksu-next-universal-4.9.337.zip` - KernelSU Next v3.2.0-legacy
            - `VoidKernel-sukisu-universal-4.9.337.zip` - SukiSU Ultra v2.0_beta

            Each universal zip **auto-detects** your ROM (AOSP/OneUI), SELinux mode
            (enforcing/permissive), and device (S9/S9+/Note 9). Just flash and reboot.

            ## Manager module
            Flash `VoidKernel-Manager-v1.1.zip` in your root manager app to get the
            `voidman` CLI (governor switching, profiles, boot-persistent settings).

            ## Features
            - 20 CPU governors incl. smartmax_eps, intelliactive, darkness, wave, ...
            - KPROBES enabled, SELinux developer mode, tuned exynos9810 base
            - Per-device hardware support (touch/MUIC/charger/camera/OIS overlays)
            - Auto-detection: ROM type, SELinux mode, device model

            > Flash via TWRP recovery. Backup before flashing.
          files: release/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
