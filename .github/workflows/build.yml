name: Build Void Kernel

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Build mode"
        required: true
        default: "universal"
        type: choice
        options:
          - universal
          - individual
      ksu_ref:
        description: "Root solution repo ref (tag/branch, blank = compatible default)"
        required: false
        default: ""
  push:
    branches: [main, master]

env:
  KSU_REF: ${{ github.event.inputs.ksu_ref || '' }}

jobs:
  # ================================================================
  # Universal zips: 3 zips (one per root), each contains 12 images
  # with auto-detect ROM/SELinux/device
  # ================================================================
  universal:
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.build_mode == 'universal' ||
      github.event.inputs.build_mode == ''
    name: Universal (${{ matrix.root }})
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        root: [ksu, ksu-next, sukisu]
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git unzip zip \
            libssl-dev libfl-dev python-is-python3 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Build universal zip (${{ matrix.root }})
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          chmod +x scripts/*.sh
          scripts/package-universal.sh "${{ matrix.root }}" "$GITHUB_WORKSPACE/kernel-src" 2>&1 | tee "$GITHUB_WORKSPACE/build-full.log"

      - name: Upload universal zip
        uses: actions/upload-artifact@v4
        with:
          name: VoidKernel-${{ matrix.root }}-universal
          path: build/zips/*.zip
          if-no-files-found: error

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildlogs-${{ matrix.root }}-universal
          path: |
            logs/*.log
            build-full.log
          if-no-files-found: ignore

  # ================================================================
  # Individual zips: 36 zips (one per variant/root/device)
  # Only runs on manual dispatch with build_mode=individual
  # ================================================================
  individual:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.build_mode == 'individual'
    name: ${{ matrix.variant }} / ${{ matrix.root }} / ${{ matrix.device }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: [aosp-enforcing, aosp-permissive, oneui-enforcing, oneui-permissive]
        root: [ksu, ksu-next, sukisu]
        device: [starlte, star2lte, crownlte]
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git unzip zip \
            libssl-dev libfl-dev python-is-python3 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Void Kernel (${{ matrix.variant }} x ${{ matrix.root }} x ${{ matrix.device }})
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          chmod +x scripts/*.sh
          scripts/build.sh --variant "${{ matrix.variant }}" --root "${{ matrix.root }}" --device "${{ matrix.device }}" 2>&1 | tee "$GITHUB_WORKSPACE/build-full.log"

      - name: Upload flashable zips
        uses: actions/upload-artifact@v4
        with:
          name: VoidKernel-${{ matrix.variant }}-${{ matrix.root }}-${{ matrix.device }}
          path: build/zips/*.zip
          if-no-files-found: error

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildlogs-${{ matrix.variant }}-${{ matrix.root }}-${{ matrix.device }}
          path: logs/*.log
          if-no-files-found: ignore

  manager:
    name: Void Kernel Manager module
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Pack manager module
        run: |
          mkdir -p build/zips
          (cd manager && zip -r9 ../build/zips/VoidKernel-Manager-v1.1.zip .)

      - name: Upload manager module
        uses: actions/upload-artifact@v4
        with:
          name: VoidKernel-Manager
          path: build/zips/VoidKernel-Manager-v1.1.zip
          if-no-files-found: error
